[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "public"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client", "prisma"]
  included_files = ["node_modules/.prisma/**", "prisma/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/docs"
  to = "/swagger.html"
  status = 200

[dev]
  framework = "#static"
  targetPort = 8888
  port = 3000
  autoLaunch = false

[template.environment]
  DATABASE_URL = "PostgreSQL connection string (Neon/Supabase)"
  JWT_SECRET = "A long random secret for JWT signing"
  JWT_EXPIRES_IN = "1d"
  JWT_REFRESH_EXPIRES_IN = "7d"
  STORAGE_URL = "Cloud storage base URL"
  STORAGE_KEY = "Cloud storage access key"
  NODE_ENV = "production"
